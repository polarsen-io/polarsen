[project]
name = "polarsen"
version = "0.1.1-rc.33"
description = ""
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Julien Brayere", email = "julien.brayere@polarsen.io" }]
license-files = ["LICENSE.md"]
license = "FSL-1.1-ALv2"

#default-groups = "all"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "datamodel-code-generator>=0.87.0",
    "httpx>=0.28.1",
    "psycopg>=3.3.6",
    "pytest-cov>=7.1.0",
    "minio>=7.2.20",
    "faker>=37.12.0",
    "tracktolib>=0.74.0",
    "pre-commit>=4.7.0",
    {include-group = "default"},
    {include-group = "llms"},
    {include-group = "api"},
    {include-group = "telegram"},
    {include-group = "bump"},
    {include-group = "cli"}
]

default = [
    "asyncpg>=0.32.0",
    "piou>=0.38.2",
    "niquests>=3.21.2",
    "tracktolib>=0.74.0",
    "urllib3-future>=2.25.905",
]


llms = [
    "google-genai>=1.75.0",
    # Needed by google-genai
    "requests>=2.34.2",
    "mistralai>=1.12.4",
    "openai>=2.54.0",
    "pydantic>=2.14.2"
]

api = [
    "fastapi[standard]>=0.162.0",
    "bcrypt>=5.0.0",
    "botocore>=1.43.123",
    "sentry-sdk[fastapi]>=2.73.0",
]

telegram = [
    "python-telegram-bot>=22.8",
    "watchfiles>=1.3.0",
    "sentry-sdk>=2.73.0",
    "pydantic>=2.14.2",
]

bump = [
    "commitizen>=4.19.3",
]

cli = [
    "botocore>=1.43.123",
    "sentry-sdk>=2.73.0",
]

[tool.pyright]
include = ["polarsen", "tests"]
exclude = []

pythonVersion = "3.13"
pythonPlatform = "Linux"

[tool.pytest.ini_options]
addopts = "--cov=polarsen -s -q -x --no-cov-on-fail"
testpaths = [
    "tests"
]
python_files = "*.py"
filterwarnings = [
    'ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning',
]


[tool.ruff]
line-length = 120
target-version = "py312"


[tool.ruff.lint]
# pre-0.17 ruff defaults
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    # imported but unused
    "F401",
    # unable to detect undefined names
    "F403",
    #
    "F405"
]
"conftest.py" = [
    # unable to detect undefined names
    "F403",
    #
    "F405"
]


[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"


[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"


[tool.setuptools.packages.find]
include = ["polarsen*"]
exclude = ["sql*", "data*", "infra*"]


[tool.commitizen]
version = "0.1.1-rc.33"
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_files = [
    "pyproject.toml:version"
]
bump_message = "chore(release): release $current_version → $new_version [skip ci]"


[tool.commitizen.customize]
template = ".github/templates/CHANGELOG.md.j2"
commit_parser = "^(?P<change_type>feat|fix|perf|docs|test|chore)(\\(.*\\))?:\\s(?P<message>.*)?"
change_type_order = ["feat", "fix", "perf", "docs", "test", "chore"]
